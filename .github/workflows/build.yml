name: Build thesis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # update the "latest" release
  pages: write # deploy to GitHub Pages
  id-token: write # authenticate the Pages deployment

# Allow only one concurrent Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # macOS runner so the Helvetica Neue system font is available and the
    # output matches a local build exactly.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      # Diagrams are exported from Miro locally via ./fetch_miro.sh and
      # committed to figures/imported/, so CI just uses the checked-in SVGs.
      - name: Compile thesis
        run: |
          mkdir -p public
          typst compile thesis.typ public/thesis.pdf
          # Redirect the site root to the PDF so both URLs open it inline.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=thesis.pdf">' > public/index.html

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: defense/slides/pnpm-lock.yaml

      - name: Build defense slides
        working-directory: defense/slides
        env:
          # The postinstall download is skipped; the export step installs only the browser it needs.
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
        run: |
          pnpm install --frozen-lockfile
          # Regenerate the backup slides so they always match the thesis figures.
          python3 scripts/backup.py
          pnpm exec slidev build --base /bachelor_thesis/slides/ --out ../../public/slides

      - name: Export defense slides to PDF
        working-directory: defense/slides
        run: |
          pnpm exec playwright install chromium
          pnpm export --output ../../public/defense.pdf

      # Stable, public download link that always points at the newest build.
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: |
            public/thesis.pdf
            public/defense.pdf

      # Package the PDF and the slides for a GitHub Pages deployment (inline viewing).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
