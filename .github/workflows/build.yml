name: Build thesis

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write # update the "latest" release
  pages: write # deploy to GitHub Pages
  id-token: write # authenticate the Pages deployment

# Allow only one concurrent Pages deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    # macOS runner so the Helvetica Neue system font is available and the
    # output matches a local build exactly.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: typst-community/setup-typst@v4

      - name: Compile thesis
        run: |
          mkdir -p public
          typst compile thesis.typ public/thesis.pdf
          # Redirect the site root to the PDF so both URLs open it inline.
          printf '<!doctype html><meta http-equiv="refresh" content="0; url=thesis.pdf">' > public/index.html

      # Stable, public download link that always points at the newest build.
      - name: Publish to the "latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          files: public/thesis.pdf

      # Package the PDF for a GitHub Pages deployment (inline viewing).
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
